# MambaJSCC training configuration of the 256 px DJI trunk (Appendix C.1 of the paper).
#
# A training configuration for the upstream MambaJSCC code
# (https://github.com/Wireless3C-SJTU/MambaJSCC), read together with a model configuration
# with the upstream vssm_tiny architecture settings (upstream configs/vssm/vssm_tiny_DIV2K.yaml:
# embedding dims 128/192/256/320, depths 2/2/6/2, 32 output channels, MLP extent, two scans,
# the settings recorded in the names of the paper's trunk checkpoints). The PSNR-only trunk is
# trained with upstream main.py; scripts/mamba_matched_pair.py reads the same pair, and refuses
# a checkpoint whose state does not match the model.
# The values are those of the authors' configuration file; only the paths are written for this
# repository's layout: the checkpoint directories are relative to the upstream checkout, and
# the data directories are ImageFolder roots (each holds one subdirectory with the DJI frames
# of that split, frames_512_v1/train and frames_512_v1/val).

TRAIN:
  EPOCHS: 400
  SAVE_FRE: 50
  LOSS: "PSNR"
  EVAL_MATRIX: "PSNR"
  ENCODER_PATH: "ckpt_dji/encoder/"
  DECODER_PATH: "ckpt_dji/decoder/"
  GAN_LOSS: False
DATA:
  DATASET: "DIV2K"  # upstream's ImageFolder loader with random 256 px crops
  TRAIN_BATCH: 4
  TEST_BATCH: 1
  IMG_SIZE: 256
  train_data_dir: "/data/dji_mamba/train"
  test_data_dir:  "/data/dji_mamba/val"
CHANNEL:
  TYPE: "awgn"
  SNR : [1,3,5,7,9,11,13,15,17,20]
  ADAPTIVE: "ssm"
