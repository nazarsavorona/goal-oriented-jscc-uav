# MambaJSCC training configuration of the 512 px DJI trunk (resolution control, Appendix C.1).
#
# Same as vssm_tiny_DJI.yaml except for the input size, the batch, the epoch count and the
# checkpoint directories, and read with the same model configuration. Pass it to
# scripts/mamba_matched_pair.py as --train-config to evaluate a trunk at 512 px.

TRAIN:
  EPOCHS: 200
  SAVE_FRE: 50
  LOSS: "PSNR"
  EVAL_MATRIX: "PSNR"
  ENCODER_PATH: "ckpt_dji512/encoder/"
  DECODER_PATH: "ckpt_dji512/decoder/"
  GAN_LOSS: False
DATA:
  DATASET: "DIV2K"  # upstream's ImageFolder loader with random 512 px crops
  TRAIN_BATCH: 2
  TEST_BATCH: 1
  IMG_SIZE: 512
  train_data_dir: "/data/dji_mamba/train"
  test_data_dir:  "/data/dji_mamba/val"
CHANNEL:
  TYPE: "awgn"
  SNR : [1,3,5,7,9,11,13,15,17,20]
  ADAPTIVE: "ssm"
